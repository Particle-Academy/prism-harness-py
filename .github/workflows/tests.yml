name: Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        # BOTH platforms, deliberately. The file lock is built on exclusive
        # file creation, and the two platforms report a contended create -- and
        # a contended DELETE -- with different errnos. A green run on one says
        # nothing about the other.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest -q

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The declared FLOOR, not the newest. Type checking on a later
          # interpreter than the package claims to support is how a package
          # ships syntax its own floor cannot run.
          python-version: "3.10"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict src tests
