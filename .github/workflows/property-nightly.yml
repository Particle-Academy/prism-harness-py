name: Property tests (long set)

# The long run of the approval pairing property tests (G-392 QC). The fast,
# fixed-seed set runs in Tests on every push and pull request; this runs only
# the property file, with many more examples and a base seed taken from the
# run, so each run explores new cases and logs the seed to replay them
# (PRISM_PROPERTY_SEED=<seed> replays one).
#
# `schedule` fires only from the default branch, and this copy runs the
# branch it was started on; a release line that carries the property file
# keeps a dispatch-only copy of this workflow.
#
# Every action is pinned to a full commit SHA (resolved read-only from the
# tag's ref, `gh api repos/<owner>/<action>/git/ref/tags/<tag>`; both tags
# are lightweight, so the ref is the commit). No secrets, read-only token.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property (a whole number from 1 to 1000000)
        required: true
        default: '5000'

permissions:
  contents: read

jobs:
  property:
    name: property / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Examples
        id: examples
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.examples }}
        run: |
          count="$(python tools/property_examples.py "$EVENT" "$GIVEN")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Property tests
        shell: bash
        env:
          PRISM_PROPERTY_EXAMPLES: ${{ steps.examples.outputs.count }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          echo "PRISM_PROPERTY_BASE_SEED=$PRISM_PROPERTY_BASE_SEED PRISM_PROPERTY_EXAMPLES=$PRISM_PROPERTY_EXAMPLES"
          python -m pytest tests/test_approval_pairing_properties.py -v
