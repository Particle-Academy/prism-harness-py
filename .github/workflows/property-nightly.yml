name: Property tests (long set)

# The long run of the approval pairing property tests (G-392 QC). The fast,
# fixed-seed set runs in Tests on every push and pull request; this runs only
# the property file, with many more examples and a base seed taken from the
# run, so each run explores new cases and logs the seed to replay them
# (PRISM_PROPERTY_SEED=<seed> replays one).
#
# `schedule` fires only from the default branch and tests it. A dispatch
# may name a release line to test instead (`ref`, G-387 round 16), so this
# one main-hosted workflow checks the release lines too: the ref is
# validated by tools/property_ref.py (tests/test_property_ref.py) BEFORE
# anything is checked out for the tests, and is refused unless it is the
# default branch or `release/<name>` (no other branch, tag, SHA or fork
# ref). The validators run from the default branch's own copy; the tests
# run from the ref's.
#
# Every action is pinned to a full commit SHA (resolved read-only from the
# tag's ref, `gh api repos/<owner>/<action>/git/ref/tags/<tag>`; both tags
# are lightweight, so the ref is the commit). No secrets, read-only token.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property (a whole number from 1 to 1000000)
        required: true
        default: '5000'
      ref:
        description: The branch to test, the default branch or release/<name>
        required: true
        default: main

permissions:
  contents: read

jobs:
  property:
    name: property / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # The validators, from the copy this workflow runs from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Examples
        id: examples
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.examples }}
        run: |
          count="$(python tools/property_examples.py "$EVENT" "$GIVEN")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Ref
        id: ref
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          branch="$(python tools/property_ref.py "$EVENT" "$GIVEN" "$DEFAULT")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      # Then the branch under test, of THIS repository only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ steps.ref.outputs.branch }}
          persist-credentials: false
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Property tests
        shell: bash
        env:
          PRISM_PROPERTY_EXAMPLES: ${{ steps.examples.outputs.count }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
          PYTHONIOENCODING: utf-8
          BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          echo "ref=$BRANCH PRISM_PROPERTY_BASE_SEED=$PRISM_PROPERTY_BASE_SEED PRISM_PROPERTY_EXAMPLES=$PRISM_PROPERTY_EXAMPLES"
          python -m pytest tests/test_approval_pairing_properties.py -v
