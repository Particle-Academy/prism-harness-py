name: Property tests (long set)

# The approval pairing property tests with many examples. The normal Tests
# workflow runs the same file with a small fixed-seed set; this one runs only
# the property tests, with a large example count and a base seed taken from the
# run, logged so a failure can be replayed (PRISM_PROPERTY_SEED, printed by the
# failing test, replays one example).
#
# This copy is on the release line, so it is dispatch-only: `schedule` fires
# from the default branch only.
on:
  workflow_dispatch:
    inputs:
      examples:
        description: "Examples to generate (a whole number >= 1)"
        required: false
        default: "5000"

permissions:
  contents: read

jobs:
  properties:
    name: Approval pairing properties
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Choose the examples and the seed
        env:
          EXAMPLES: ${{ inputs.examples }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          examples="${EXAMPLES:-5000}"
          case "$examples" in
            ''|*[!0-9]*) echo "::error::examples must be a whole number >= 1, got '${examples}'."; exit 1 ;;
          esac
          if [ "$((10#$examples))" -lt 1 ]; then
            echo "::error::examples must be a whole number >= 1, got '${examples}'."
            exit 1
          fi
          seed=$(( (RUN_ID * 10 + RUN_ATTEMPT) % 2000000000 + 1 ))
          echo "PRISM_PROPERTY_EXAMPLES=$((10#$examples))" >> "$GITHUB_ENV"
          echo "PRISM_PROPERTY_BASE_SEED=${seed}" >> "$GITHUB_ENV"
          echo "Property run: $((10#$examples)) examples from base seed ${seed} (run ${RUN_ID}, attempt ${RUN_ATTEMPT})."

      - run: python -m pytest -q -s tests/test_approval_pairing_properties.py
