[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-ai-harness"
version = "0.1.0"
description = "Durable agent sessions for Python — threads, session state and store drivers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Particle Academy" }]
keywords = ["llm", "agents", "prism", "ai", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_harness"]

# The source archive carries the package and its licence, and nothing else: not the Lab's
# loopback agent, CI workflows or contributor notes. Anchored with a leading slash, since an
# unanchored README.md also matches agent/README.md.
[tool.hatch.build.targets.sdist]
include = ["/src/prism_harness", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
